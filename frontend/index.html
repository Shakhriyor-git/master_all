<!doctype html>
<html lang="uz" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Usta Hisob</title>
    <!--
      Eski bundle'dan himoya — React yuklanishidan OLDIN, inline.
      Vite build vaqtida head boshiga `window.__BUILD_ID__` (git sha) yozadi.
      Serverdagi version.json shundan farq qilsa — bu HTML keshdan kelgan,
      eski bundle'ni yuklaydi. Kesh chetlab o'tiladigan URL bilan reload.
      Aylanmaslik uchun: bir build uchun sessiyada faqat bir marta.
    -->
    <script>
      ;(async function () {
        try {
          var mine = window.__BUILD_ID__
          if (!mine) return // dev rejim
          var res = await fetch('/version.json?t=' + Date.now(), {
            cache: 'no-store',
          })
          if (!res.ok) return
          var build = (await res.json()).build
          if (!build || build === mine) return
          var KEY = 'reloaded_for'
          if (sessionStorage.getItem(KEY) === build) return
          sessionStorage.setItem(KEY, build)
          var u = new URL(location.href)
          u.searchParams.set('v', build.slice(0, 7))
          location.replace(u.toString())
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
