name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Frontend bor-yo'qligini aniqlash
        id: fe
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Node
        if: steps.fe.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build (server emas — GitHub Actions ichida)
        if: steps.fe.outputs.exists == 'true'
        working-directory: frontend
        env:
          VITE_API_URL: https://${{ secrets.DOMAIN }}
        run: |
          npm ci
          npm run build

      - name: SSH kalitini sozlash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Frontend dist ni serverga yuborish
        if: steps.fe.outputs.exists == 'true'
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p ~/master_all/frontend-dist"
          rsync -az --delete-after -e "ssh -i ~/.ssh/id_deploy" \
            frontend/dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/master_all/frontend-dist/"

      - name: Serverda deploy
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<'EOF'
          set -e
          cd ~/master_all
          git pull --ff-only
          docker compose -f docker-compose.prod.yml up -d --build
          docker compose -f docker-compose.prod.yml exec -T api alembic upgrade head
          docker image prune -f
          EOF

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://${{ secrets.DOMAIN }}/health" > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "urinish $i muvaffaqiyatsiz, 6s kutamiz..."
            sleep 6
          done
          echo "Health check muvaffaqiyatsiz"
          exit 1
